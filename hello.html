<!DOCTYPE html>
<html lang="fa">
<head>
<meta charset="UTF-8">
<title>Flash Cards</title>

<style>
/* =================== پایه =================== */
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

body {
    font-family: Tahoma, sans-serif;
    background: url("https://images.unsplash.com/photo-1558494949-ef010cbdcc31") no-repeat center center fixed;
    background-size: cover;
    color: #fff;
}

.overlay {
    background: rgba(0, 0, 0, 0.75);
    min-height: 100vh;
    padding: 20px;
}

/* =================== عنوان =================== */
h1 {
    text-align: center;
    margin-bottom: 20px;
}

/* =================== کنترل‌ها =================== */
.controls {
    max-width: 600px;
    margin: auto;
    background: rgba(255, 255, 255, 0.1);
    padding: 15px;
    border-radius: 10px;
}

input, textarea, button {
    width: 100%;
    margin: 8px 0;
    padding: 8px;
    border-radius: 6px;
    border: none;
    font-size: 14px;
}

button {
    background: #00c853;
    color: #000;
    cursor: pointer;
    font-weight: bold;
    transition: background 0.3s, color 0.3s, transform 0.2s, box-shadow 0.2s;
}

button:hover {
    background: rgb(204, 0, 0);
    color: #fff;
    transform: scale(1.05);
    box-shadow: 0 5px 15px rgba(0,0,0,0.3);
}

button:active {
    transform: scale(0.95);
}

/* =================== فلش کارت‌ها =================== */
.flashcards {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 20px;
    margin-top: 30px;
}

.card {
    perspective: 1000px;
    position: relative;
    width: 220px;
    margin: 10px;
    opacity: 0;
    transform: translateY(50px) rotateX(-15deg) scale(0.9);
    animation: cardEntry 0.6s forwards cubic-bezier(0.68, -0.55, 0.27, 1.55);
}

/* =================== کارت داخلی =================== */
.card-inner {
    position: relative;
    width: 100%;
    height: 200px;
    transition: transform 0.6s, box-shadow 0.3s;
    transform-style: preserve-3d;
    cursor: pointer;

    /* متن کارت وسط کارت قرار گیرد */
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
}

.card.flip .card-inner {
    transform: rotateY(180deg);
}

/* =================== جلو و عقب کارت =================== */
.front, .back {
    position: absolute;
    width: 100%;
    height: 100%;
    backface-visibility: hidden;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 10px;
    box-sizing: border-box;
    font-size: 16px;
    font-weight: bold;
    color: #fff;
}

.front {
    background: var(--color);
    transition: background 0.3s;
}

.back {
    background: #222;
    transform: rotateY(180deg);
}

/* =================== افکت هاور کارت =================== */
.card:not(.flip):hover .card-inner {
    transform: scale(1.05);
    box-shadow: 0 10px 20px rgba(0,0,0,0.5);
}

/* =================== دکمه حذف =================== */
.delete-btn {
    position: absolute;
    top: 6px;
    right: 6px;
    width: 22px;
    height: 22px;
    border-radius: 50%;
    border: none;
    background: rgba(0, 0, 0, 0.6);
    color: #fff;
    font-size: 16px;
    cursor: pointer;
    z-index: 10;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.2s;
}

.delete-btn:hover {
    background: red;
    transform: scale(1.2);
}

/* =================== انیمیشن ورود کارت =================== */
@keyframes cardEntry {
    0% {
        opacity: 0;
        transform: translateY(50px) rotateX(-15deg) scale(0.9);
    }
    60% {
        opacity: 1;
        transform: translateY(-10px) rotateX(5deg) scale(1.05);
    }
    80% {
        transform: translateY(5px) rotateX(-2deg) scale(0.98);
    }
    100% {
        opacity: 1;
        transform: translateY(0) rotateX(0deg) scale(1);
    }
}

/* =================== ریسپانسیو =================== */
@media (max-width: 768px) {
    .card {
        width: 45%;
    }
}

@media (max-width: 480px) {
    .card {
        width: 100%;
    }

    .controls {
        padding: 10px;
    }

    h1 {
        font-size: 20px;
    }
}
</style>
</head>

<body>
<div class="overlay">

    <!-- عنوان -->
    <h1>🧠 Flash Cards</h1>

    <!-- فرم ایجاد کارت -->
    <div class="controls">
        <textarea id="frontText" placeholder="Front (سؤال یا مفهوم)"></textarea>
        <textarea id="backText" placeholder="Back (توضیح یا مثال)"></textarea>

        <label>🎨 رنگ کارت</label>
        <input type="color" id="cardColor" value="#2196f3">

        <button onclick="addCard()">➕ افزودن کارت</button>
    </div>

    <!-- محل نمایش کارت‌ها -->
    <div class="flashcards" id="cards"></div>

</div>

<script>
/* =================== داده‌ها و ذخیره‌سازی =================== */
let cards = JSON.parse(localStorage.getItem("flashcards")) || [];

function save() {
    localStorage.setItem("flashcards", JSON.stringify(cards));
}

/* =================== رندر کارت‌ها =================== */
function render() {
    const container = document.getElementById("cards");
    container.innerHTML = "";

    cards.forEach((c, i) => {
        const card = document.createElement("div");
        card.className = "card";

        card.innerHTML = `
            <button class="delete-btn" onclick="deleteCard(${i})">×</button>
            <div class="card-inner" style="--color:${c.color}">
                <div class="front">${c.front}</div>
                <div class="back">${c.back}</div>
            </div>
        `;

        card.querySelector(".card-inner").onclick = () =>
            card.classList.toggle("flip");

        container.appendChild(card);
    });
}

/* =================== افزودن کارت جدید =================== */
function addCard() {
    const front = frontText.value.trim();
    const back = backText.value.trim();
    const color = cardColor.value;

    if (!front || !back) {
        alert("Front و Back نباید خالی باشند ❗");
        return;
    }

    cards.push({ front, back, color });
    save();
    render();

    frontText.value = "";
    backText.value = "";
}

/* =================== حذف کارت =================== */
function deleteCard(index) {
    if (confirm("این کارت حذف شود؟")) {
        cards.splice(index, 1);
        save();
        render();
    }
}

/* =================== رندر اولیه =================== */
render();
</script>
</body>
</html>
